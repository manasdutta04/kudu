name: Bug report
description: Something didn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you said, what you expected, and what Kudu did instead.
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: App you were dictating into
      placeholder: e.g. Notes, Slack, Terminal, Chrome (Gmail)
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
      placeholder: e.g. macOS 26.1, MacBook Air M2
    validations:
      required: true
  - type: dropdown
    id: key
    attributes:
      label: Dictation key
      options: [fn, Right ⌘, Right ⌥]
  - type: textarea
    id: logs
    attributes:
      label: Logs (optional)
      description: "Run `log stream --predicate 'subsystem == \"app.kudu\"'` while reproducing. Please remove anything private first."
      render: text
