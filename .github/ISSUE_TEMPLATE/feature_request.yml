name: Feature request
description: Suggest an idea or improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or situation, not the solution yet.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could Kudu help?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
  - type: dropdown
    id: platforms
    attributes:
      label: Platforms
      multiple: true
      options: [macOS, Windows, Linux]
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This can work without sending anything off the computer.
          required: true
