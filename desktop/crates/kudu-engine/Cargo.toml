[package]
name = "kudu-engine"
description = "Kudu's audio capture, on-device speech recognition and optional small language model"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["smart"]
# Smart formatting and Command mode with a small local language model (llama.cpp). Needs CMake
# and a C++ compiler to build. Without it Kudu uses the rules only.
smart = ["dep:llama-cpp-2", "dep:encoding_rs"]

[dependencies]
kudu-core.workspace = true
anyhow.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true
parking_lot.workspace = true
crossbeam-channel.workspace = true
cpal = "0.18"
sherpa-onnx = "1.13.8"
# The OS's own TLS (SChannel on Windows, OpenSSL on Linux): smaller, no bundled crypto to build.
ureq = { version = "3", default-features = false, features = ["native-tls-no-default"] }
bzip2 = "0.6"
tar = "0.4"
llama-cpp-2 = { version = "0.1.159", optional = true }
encoding_rs = { version = "0.8", optional = true }

[[example]]
name = "format"
required-features = ["smart"]
