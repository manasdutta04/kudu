[workspace]
resolver = "2"
members = ["crates/kudu-core", "crates/kudu-engine", "crates/kudu-app"]

[workspace.package]
version = "0.1.4"
edition = "2021"
license = "MIT"
rust-version = "1.95"
repository = "https://github.com/manasdutta04/kudu"

[workspace.dependencies]
kudu-core = { path = "crates/kudu-core" }
kudu-engine = { path = "crates/kudu-engine", default-features = false }
anyhow = "1"
log = "0.4"
regex = "1.11"
fancy-regex = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
crossbeam-channel = "0.5"
sha2 = "0.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
# Unwind (not abort) on a panic, so a failure in a background task (a download, one
# dictation) is reported and recovered from instead of closing Kudu.

# Fast debug builds that still run the speech model at a usable speed.
[profile.dev.package."*"]
opt-level = 2
